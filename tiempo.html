<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14121d">
<title>Nuestro Tiempo · Nuestros Días</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

<script src="js/config.js"></script>
<link rel="stylesheet" href="css/tailwind.css">
<link rel="stylesheet" href="css/cosmic.css">
</head>

<body data-pagina="tiempo"
      class="bg-background text-on-surface font-body-md antialiased min-h-screen relative overflow-x-hidden pb-28 lg:pb-0 flex flex-col
             selection:bg-primary-container selection:text-on-primary-container">

<main class="relative z-10 flex-1 w-full max-w-lg md:max-w-container-max mx-auto pt-20 lg:pt-32 md:pb-24 px-space-md md:px-12 flex flex-col gap-6 md:gap-12">

  <!-- 1 · Encabezado -->
  <section class="text-center pt-2 pb-1 md:pt-4 md:pb-0 md:max-w-3xl md:mx-auto md:space-y-4 enter">
    <div class="inline-flex items-center gap-1.5 md:gap-2 px-3 md:px-4 py-1 md:py-1.5 rounded-full bg-surface-container-low/70 md:bg-surface-container-high/60 border border-secondary/20 md:border-primary/30 backdrop-blur-md mb-3 md:mb-0 md:shadow-[0_0_20px_rgba(244,114,182,0.15)]">
      <span class="material-symbols-outlined fill-icon text-sm text-primary">favorite</span>
      <span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary md:text-primary-fixed" data-etiqueta></span>
      <span class="hidden md:inline-block w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
    </div>

    <!-- Título: corto en móvil, ampliado en escritorio -->
    <h1 class="md:hidden font-headline-lg-mobile text-headline-lg-mobile text-transparent bg-clip-text bg-gradient-to-r from-on-surface via-primary-fixed to-primary font-medium tracking-tight" data-titulo></h1>
    <h1 class="hidden md:block font-display text-display text-on-surface tracking-tight">
      <span data-titulo-amplio></span>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-fixed via-primary to-secondary" data-titulo-destacado></span>
    </h1>

    <p class="font-body-md text-body-md md:font-body-lg md:text-body-lg text-on-surface-variant mt-2 md:mt-0 max-w-xs md:max-w-2xl mx-auto leading-relaxed">
      <span class="md:hidden" data-subtitulo></span>
      <span class="hidden md:inline" data-subtitulo-amplio></span>
    </p>

    <div class="flex items-center justify-center gap-2 mt-3 md:mt-0 md:pt-2 font-label-sm text-label-sm md:font-label-md md:text-label-md">
      <span class="md:hidden relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
      </span>
      <span class="hidden md:inline material-symbols-outlined text-tertiary text-base">explore</span>
      <span class="tracking-wider text-secondary md:text-on-surface-variant/80 md:tracking-normal" data-orbita></span>
    </div>
  </section>

  <!-- 2 · Contador en vivo -->
  <!-- Móvil: una tarjeta de cristal con rejilla 3×2 · Escritorio: 6 tarjetas independientes -->
  <section class="relative frosted-glass-card md:bg-transparent md:backdrop-blur-none md:border-0 md:shadow-none rounded-2xl p-5 md:p-0 enter enter-1">

    <div class="flex items-center justify-between mb-4 border-b border-outline-variant/15 pb-3 md:hidden">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary text-sm">timelapse</span>
        <span class="font-label-md text-label-md text-secondary tracking-wide">Contador en Vivo</span>
      </div>
      <span class="px-2 py-0.5 rounded-full bg-secondary-container/40 text-secondary-fixed font-label-sm text-label-sm" data-hito-cumplido></span>
    </div>

    <div class="grid grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-3 md:gap-4 lg:gap-6" id="contador"></div>

    <div class="mt-4 pt-3 border-t border-outline-variant/15 flex items-center justify-between text-on-surface-variant text-xs font-body-md md:hidden">
      <div class="flex items-center gap-1.5">
        <span class="material-symbols-outlined fill-icon text-primary text-sm animate-pulse">favorite</span>
        <span>Cada segundo cuenta contigo</span>
      </div>
      <span class="text-secondary font-label-sm text-label-sm" data-desde></span>
    </div>
  </section>

  <!-- 3 · Hitos + meta -->
  <section class="flex flex-col gap-3 md:grid md:grid-cols-12 md:gap-6 md:items-stretch enter enter-2">

    <div class="flex items-center justify-between px-1 md:hidden">
      <h2 class="font-display text-lg text-on-surface font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-base">flare</span>
        Nuestros Hitos
      </h2>
      <span class="font-label-sm text-label-sm text-secondary" data-etapa></span>
    </div>

    <!-- Hitos: 3 micro-tarjetas en móvil, 3 filas anchas en escritorio -->
    <div class="grid grid-cols-3 gap-2.5 md:grid-cols-1 md:col-span-7 md:gap-4" id="hitos"></div>

    <!-- Meta -->
    <div class="p-4 md:p-7 rounded-xl bg-surface-container-low/90 md:bg-surface-container-low/80 md:backdrop-blur-2xl border border-secondary/20 md:border-primary/25 shadow-sm md:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.7),0_0_30px_rgba(192,132,252,0.08)] relative overflow-hidden md:col-span-5 md:flex md:flex-col md:justify-between">
      <div class="hidden md:block absolute -right-12 -top-12 w-36 h-36 rounded-full bg-primary-container/20 blur-2xl pointer-events-none"></div>

      <div>
        <!-- Cabecera móvil -->
        <div class="flex items-center justify-between mb-2 md:hidden">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-base">flag</span>
            <span class="text-body-md font-semibold text-on-surface" data-meta-titulo></span>
          </div>
          <span class="font-label-md text-label-md font-bold text-primary" data-meta-pct></span>
        </div>

        <!-- Cabecera escritorio -->
        <div class="hidden md:flex items-center justify-between mb-4">
          <span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Próximo Hito</span>
          <span class="px-3 py-1 rounded-full bg-primary/20 text-primary font-label-sm text-label-sm font-semibold" data-meta-pct-amplio></span>
        </div>
        <h2 class="hidden md:block font-display text-headline-md text-on-surface mb-2" data-meta-titulo-amplio></h2>
        <p class="hidden md:block font-body-md text-body-md text-on-surface-variant mb-6" data-meta-descripcion></p>

        <div class="md:space-y-2">
          <div class="hidden md:flex justify-between font-label-md text-label-md">
            <span class="text-on-surface font-semibold" data-meta-vividos></span>
            <span class="text-secondary font-semibold" data-meta-objetivo></span>
          </div>
          <div class="w-full bg-surface-variant/60 md:bg-surface-container-highest h-2.5 md:h-3 rounded-full overflow-hidden p-0.5 border border-outline-variant/20 md:border-white/5">
            <div class="bg-gradient-to-r from-primary via-primary-container to-secondary md:from-primary-container md:via-primary md:to-secondary h-full rounded-full transition-all duration-1000 shadow-[0_0_8px_rgba(244,114,182,0.5)] md:shadow-[0_0_12px_rgba(244,114,182,0.6)]" data-meta-barra style="width:0%"></div>
          </div>
        </div>

        <div class="flex justify-between items-center mt-2.5 text-on-surface-variant font-label-sm text-label-sm md:hidden">
          <span data-meta-actual></span>
          <span class="text-secondary font-medium" data-meta-restante></span>
        </div>
      </div>

      <!-- Pie motivacional (escritorio) -->
      <div class="hidden md:flex pt-6 border-t border-outline-variant/30 items-center gap-3 mt-6">
        <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">
          <span class="material-symbols-outlined text-base">rocket_launch</span>
        </div>
        <p class="font-label-md text-label-md text-primary-fixed" data-meta-motivacion></p>
      </div>
    </div>
  </section>

</main>

<script src="js/common.js"></script>
<script>
(function () {
  Cosmic.acceso.exigir();

  const c = COSMIC.tiempo;
  const $ = (s) => document.querySelector(s);
  const t0 = Cosmic.tiempo();

  /* ── Textos ── */
  $('[data-etiqueta]').textContent         = Cosmic.etiquetaHito().toUpperCase();
  $('[data-titulo]').textContent           = c.titulo;
  $('[data-titulo-amplio]').textContent    = c.tituloAmplio;
  $('[data-titulo-destacado]').textContent = c.tituloDestacado;
  $('[data-subtitulo]').textContent        = Cosmic.texto(c.subtitulo);
  $('[data-subtitulo-amplio]').textContent = Cosmic.texto(c.subtituloAmplio);
  $('[data-orbita]').textContent  = 'Juntos desde el ' + Cosmic.fechaLarga();
  $('[data-desde]').textContent   = 'Desde el ' + Cosmic.fechaLarga();

  $('[data-hito-cumplido]').textContent = t0.mesesTotales
    ? (t0.mesesTotales === 1 ? '1 Mes Cumplido' : t0.mesesTotales + ' Meses Cumplidos')
    : Cosmic.miles(t0.diasTotales) + ' Días';

  const romanos = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
  $('[data-etapa]').textContent = 'Etapa ' + romanos[Math.min(11, Math.max(0, t0.mesesTotales - 1))];

  /* ── Cronómetro: 6 tarjetas ────────────────────────────────
     En móvil son celdas compactas dentro de la tarjeta de cristal;
     en escritorio, tarjetas independientes con pie de texto.      */
  const unidades = [
    { clave: 'años',     etiqueta: 'Años',     color: 'secondary',     destacada: false },
    { clave: 'meses',    etiqueta: 'Meses',    color: 'primary',       destacada: true  },
    { clave: 'dias',     etiqueta: 'Días',     color: 'secondary',     destacada: true  },
    { clave: 'horas',    etiqueta: 'Horas',    color: 'tertiary',      destacada: false },
    { clave: 'minutos',  etiqueta: 'Minutos',  color: 'primary',       destacada: false },
    { clave: 'segundos', etiqueta: 'Segundos', color: 'primary-fixed', destacada: false, viva: true },
  ];

  document.getElementById('contador').innerHTML = unidades.map((u) => {
    const marcoMovil = u.destacada
      ? 'bg-surface-container-high/60 border-primary-container/30'
      : 'bg-surface-container-high/40 border-outline-variant/20';
    const marcoAmplio = u.destacada && u.clave === 'meses'
      ? 'md:bg-surface-container-low/80 md:border-primary/40 md:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.7),0_0_25px_rgba(244,114,182,0.12)]'
      : 'md:bg-surface-container-low/70 md:border-outline-variant/30 md:hover:border-primary/40 md:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.7)]';
    const colorCifra = u.destacada
      ? 'text-primary font-semibold'
      : (u.viva ? 'text-secondary md:text-primary font-medium' : 'text-on-surface');

    return `
      <div class="group relative flex flex-col items-center justify-center text-center rounded-xl border p-3 md:p-6 backdrop-blur-none md:backdrop-blur-xl transition-all duration-300 md:hover:-translate-y-1.5 ${marcoMovil} ${marcoAmplio}">
        ${u.clave === 'meses'
          ? `<div class="hidden md:block absolute -top-2 px-2.5 py-0.5 rounded-full bg-primary text-on-primary font-label-sm text-[10px] tracking-wider font-semibold">HITO HOY</div>`
          : ''}

        <!-- Escritorio: etiqueta arriba -->
        <span class="hidden md:flex items-center gap-1 font-label-sm text-label-sm text-${u.color} tracking-widest uppercase mb-1">
          ${u.etiqueta}
          ${u.viva ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary animate-ping"></span>' : ''}
        </span>

        <span class="font-display text-headline-md md:text-display ${colorCifra} md:group-hover:text-${u.color} transition-colors" data-c="${u.clave}">00</span>

        <!-- Móvil: etiqueta abajo -->
        <span class="md:hidden font-label-sm text-label-sm ${u.destacada ? 'text-primary font-medium' : (u.viva ? 'text-secondary' : 'text-on-surface-variant')} uppercase tracking-wider mt-1">${u.etiqueta}</span>

        <!-- Escritorio: pie descriptivo -->
        <span class="hidden md:block font-label-sm text-label-sm ${u.clave === 'meses' ? 'text-primary/80 font-semibold' : 'text-on-surface-variant/60'} mt-1">${c.piesContador[u.clave]}</span>

        ${u.viva ? '<span class="md:hidden absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-primary-container"></span>' : ''}
      </div>`;
  }).join('');

  /* ── Hitos ── */
  document.getElementById('hitos').innerHTML = c.hitos.map((h) => `
    <!-- Móvil: micro-tarjeta vertical -->
    <div class="md:hidden p-3 rounded-xl bg-surface-container-low/80 border border-outline-variant/20 flex flex-col items-center text-center">
      <div class="w-7 h-7 rounded-full bg-surface-variant/50 flex items-center justify-center mb-1.5 text-${h.color}">
        <span class="material-symbols-outlined text-sm">${h.icono}</span>
      </div>
      <span class="font-title-lg text-title-lg font-bold text-on-surface">${Cosmic.texto(h.valor)}</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant leading-tight mt-0.5">${h.texto}</span>
    </div>

    <!-- Escritorio: fila ancha con descripción -->
    <div class="hidden md:flex rounded-xl bg-surface-container-low/60 backdrop-blur-md border border-white/10 p-5 items-center justify-between gap-4 hover:border-${h.color}/30 transition-all duration-300 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)]">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-${h.color}/15 border border-${h.color}/30 flex items-center justify-center text-${h.color} shrink-0">
          <span class="material-symbols-outlined text-2xl">${h.icono}</span>
        </div>
        <div>
          <p class="font-title-lg text-title-lg text-on-surface">${Cosmic.texto(h.titulo)}</p>
          <p class="font-body-md text-body-md text-on-surface-variant">${h.descripcion}</p>
        </div>
      </div>
      <span class="material-symbols-outlined text-${h.color}/40 hidden sm:block text-2xl">arrow_forward</span>
    </div>`).join('');

  /* ── Meta ── */
  const meta = c.meta.dias;
  const dias = t0.diasTotales;
  const pct  = Math.min(100, Math.round((dias / meta) * 100));
  const faltan = Math.max(0, meta - dias);

  $('[data-meta-titulo]').textContent        = c.meta.titulo;
  $('[data-meta-titulo-amplio]').textContent = c.meta.tituloAmplio;
  $('[data-meta-descripcion]').textContent   = c.meta.descripcion;
  $('[data-meta-pct]').textContent           = pct + '%';
  $('[data-meta-pct-amplio]').textContent    = pct + '% Logrado';
  $('[data-meta-actual]').textContent        = 'Día actual: ' + Cosmic.miles(dias);
  $('[data-meta-vividos]').textContent       = Cosmic.miles(dias) + ' Días Vividos';
  $('[data-meta-objetivo]').textContent      = Cosmic.miles(meta) + ' Días Meta';
  $('[data-meta-restante]').textContent      = faltan ? 'Faltan solo ' + Cosmic.miles(faltan) + ' días ✨' : '¡Meta alcanzada! ✨';
  $('[data-meta-motivacion]').innerHTML      = faltan
    ? `Faltan solo <strong class="text-white font-bold">${Cosmic.miles(faltan)} días</strong> para el próximo gran hito.`
    : '<strong class="text-white font-bold">¡Meta alcanzada!</strong> Rumbo al siguiente hito.';
  requestAnimationFrame(() => $('[data-meta-barra]').style.width = pct + '%');

  /* ── Contador en vivo ── */
  const campos = {};
  document.querySelectorAll('[data-c]').forEach((el) => campos[el.dataset.c] = el);

  function tic() {
    const t = Cosmic.tiempo();
    // Odómetro de edad: cada unidad se reinicia a 0 al completar la superior
    // (12 meses → 1 año, N días del mes → 1 mes, etc.), como un cumpleaños.
    campos['años'].textContent     = Cosmic.pad(t.años);
    campos['meses'].textContent    = Cosmic.pad(t.meses);
    campos['dias'].textContent     = Cosmic.pad(t.diasDelMes);
    campos['horas'].textContent    = Cosmic.pad(t.horas);
    campos['minutos'].textContent  = Cosmic.pad(t.minutos);
    campos['segundos'].textContent = Cosmic.pad(t.segundos);
  }
  tic();
  setInterval(tic, 1000);
})();
</script>
</body>
</html>
