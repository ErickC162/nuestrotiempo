<!-- Interactive Pin Keypad Vanilla Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const pips = document.querySelectorAll('#pin-display > div');
      let currentDigits = 2; // Starts with 2 filled as preview requested
      
      const updatePips = () => {
        pips.forEach((pip, index) => {
          if (index < currentDigits) {
            pip.className = "w-3.5 h-3.5 rounded-full bg-primary shadow-[0_0_12px_rgba(244,114,182,0.6)] border border-primary-container transition-all duration-300";
          } else {
            pip.className = "w-3.5 h-3.5 rounded-full bg-surface-container/60 border border-outline-variant/60 transition-all duration-300";
          }
        });
      };

      const buttons = document.querySelectorAll('section button');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.innerText.trim();
          const isBackspace = btn.querySelector('[data-icon="backspace"]');
          
          if (isBackspace) {
            if (currentDigits > 0) currentDigits--;
          } else if (text === 'C') {
            currentDigits = 0;
          } else if (!isNaN(parseInt(text))) {
            if (currentDigits < 6) currentDigits++;
          }
          updatePips();
        });
      });
    });
  </script>
