<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14121d">
<title>Nuestro Tiempo · Recuerdos</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/cosmic.css">
</head>

<body data-pagina="recuerdos"
      class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen relative overflow-x-hidden pb-28 lg:pb-0 flex flex-col
             selection:bg-primary selection:text-on-primary">

<main class="relative z-10 flex-1 pt-16 lg:pt-28 md:pb-20 px-gutter-mobile md:px-12 max-w-lg md:max-w-container-max mx-auto flex flex-col gap-space-md md:gap-16">

  <!-- Encabezado -->
  <section class="mt-space-xs md:mt-0 md:pt-10 flex items-end md:flex-col md:items-center justify-between md:justify-start md:text-center relative enter">
    <div class="hidden md:block absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="md:contents">
      <!-- Insignia -->
      <span class="text-label-sm font-label-sm uppercase text-secondary tracking-widest block mb-0.5 md:hidden" data-etiqueta></span>
      <div class="hidden md:inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-surface-container-high/60 backdrop-blur-md border border-primary/25 mb-6 text-label-sm font-label-sm text-primary uppercase tracking-widest shadow-[0_0_20px_rgba(255,175,211,0.15)] relative z-10">
        <span class="material-symbols-outlined fill-icon text-[14px]">stars</span>
        <span>Portal de Recuerdos</span>
        <span class="text-on-surface-variant/40">•</span>
        <span class="text-secondary font-medium" data-etiqueta-amplia></span>
      </div>

      <h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-background tracking-tight md:hidden" data-titulo></h1>
      <h1 class="hidden md:block font-display text-display max-w-3xl text-transparent bg-clip-text bg-gradient-to-r from-on-surface via-primary-fixed to-secondary tracking-tight mb-5 relative z-10" data-titulo-amplio></h1>

      <p class="text-body-md font-body-md text-on-surface-variant mt-0.5 md:hidden" data-subtitulo></p>
      <p class="hidden md:block font-body-lg text-body-lg text-on-surface-variant max-w-2xl leading-relaxed mb-9 relative z-10" data-subtitulo-amplio></p>
    </div>

    <!-- Acciones -->
    <button type="button" data-anadir
            class="shrink-0 flex items-center gap-1 px-3.5 py-2 rounded-full bg-gradient-to-r from-primary-container to-secondary text-on-primary font-label-md text-label-md shadow-[0_4px_16px_-2px_rgba(244,114,182,0.35)] active:scale-95 transition-transform duration-150 md:hidden">
      <span class="material-symbols-outlined text-[18px]">add_photo_alternate</span>
      <span>Añadir</span>
    </button>

    <div class="hidden md:flex flex-wrap items-center justify-center gap-4 relative z-10">
      <button type="button" data-anadir
              class="group px-6 py-3.5 rounded-full bg-gradient-to-r from-primary-container to-secondary text-surface-container-lowest font-label-md text-label-md flex items-center gap-2.5 font-semibold shadow-[0_8px_24px_-4px_rgba(244,114,182,0.4)] transition-all duration-300 hover:scale-[1.02] active:scale-95">
        <span class="material-symbols-outlined text-[18px] transition-transform group-hover:rotate-90 duration-300">add</span>
        <span>Añadir Nuevo Recuerdo</span>
      </button>
      <button type="button" data-ir-galeria
              class="px-6 py-3.5 rounded-full bg-surface-container/50 hover:bg-surface-container-high backdrop-blur-md border border-outline-variant/40 hover:border-primary/40 text-on-surface hover:text-primary font-label-md text-label-md flex items-center gap-2 transition-all duration-300 active:scale-95">
        <span class="material-symbols-outlined fill-icon text-[18px]">photo_library</span>
        <span>Explorar Álbum</span>
      </button>
    </div>
  </section>

  <!-- ══ DESTACADOS ══ -->

  <!-- Móvil: carrusel horizontal -->
  <section class="mt-space-xs md:hidden enter enter-1">
    <div class="flex items-center justify-between mb-space-2xs">
      <div class="flex items-center gap-1.5 text-label-sm font-label-sm text-secondary">
        <span class="material-symbols-outlined text-[14px]">stars</span>
        <span>Momentos Destacados</span>
      </div>
      <span class="text-label-sm font-label-sm text-on-surface-variant/70" data-conteo-destacados></span>
    </div>
    <div class="flex gap-space-sm overflow-x-auto snap-x snap-mandatory no-scrollbar pb-1 -mx-gutter-mobile px-gutter-mobile" id="destacados-movil"></div>
  </section>

  <!-- Escritorio: recuerdo protagonista con navegación -->
  <section class="hidden md:block relative w-full enter enter-1">
    <div class="flex items-center justify-between mb-6 px-1">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[18px]">favorite</span>
        <span class="text-label-md font-label-md text-on-surface tracking-wide">Recuerdo Protagonista</span>
      </div>
      <div class="flex items-center gap-2 text-label-sm font-label-sm text-on-surface-variant">
        <span class="inline-block w-2 h-2 rounded-full bg-primary animate-pulse"></span>
        <span>Hito de Aniversario</span>
      </div>
    </div>

    <div class="relative flex items-center justify-center w-full min-h-[440px]">
      <!-- Tarjetas laterales atenuadas -->
      <!-- Solo desde 1280px: por debajo quedarían tapadas por la tarjeta central -->
      <div class="hidden xl:flex absolute left-0 w-[300px] h-[340px] rounded-2xl bg-surface-container-low/40 backdrop-blur-md border border-white/5 opacity-25 scale-90 -rotate-3 pointer-events-none p-4 flex-col justify-end">
        <span class="text-label-sm font-label-sm text-secondary">Recuerdo Anterior</span>
        <h4 class="font-display text-headline-md text-on-surface/70" data-lateral-prev></h4>
      </div>
      <div class="hidden xl:flex absolute right-0 w-[300px] h-[340px] rounded-2xl bg-surface-container-low/40 backdrop-blur-md border border-white/5 opacity-25 scale-90 rotate-3 pointer-events-none p-4 flex-col justify-end">
        <span class="text-label-sm font-label-sm text-primary">Siguiente Recuerdo</span>
        <h4 class="font-display text-headline-md text-on-surface/70" data-lateral-next></h4>
      </div>

      <!-- Tarjeta central -->
      <div class="relative z-20 w-full max-w-3xl rounded-2xl bg-surface-container/75 backdrop-blur-2xl border border-primary/30 p-8 transition-all duration-500 hover:border-primary/50"
           id="protagonista"></div>
    </div>

    <!-- Controles -->
    <div class="flex items-center justify-between max-w-3xl mx-auto mt-6 px-4">
      <button type="button" data-carrusel="-1" aria-label="Recuerdo anterior"
              class="w-10 h-10 rounded-full bg-surface-container/60 hover:bg-surface-container-high border border-outline-variant/40 flex items-center justify-center text-on-surface hover:text-primary transition-all duration-200 active:scale-90">
        <span class="material-symbols-outlined text-[20px]">chevron_left</span>
      </button>
      <div class="flex items-center gap-2" id="puntos"></div>
      <button type="button" data-carrusel="1" aria-label="Recuerdo siguiente"
              class="w-10 h-10 rounded-full bg-surface-container/60 hover:bg-surface-container-high border border-outline-variant/40 flex items-center justify-center text-on-surface hover:text-primary transition-all duration-200 active:scale-90">
        <span class="material-symbols-outlined text-[20px]">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- ══ COLECCIÓN ══ -->
  <section class="mt-space-2xs md:mt-0 flex flex-col gap-space-md md:gap-8 enter enter-2" id="galeria-seccion">

    <!-- Cabecera de la colección -->
    <div class="md:flex md:flex-row md:items-end md:justify-between md:gap-6 md:border-b md:border-outline-variant/30 md:pb-6">
      <div class="hidden md:block">
        <div class="flex items-center gap-2 mb-1 text-primary">
          <span class="material-symbols-outlined text-[16px]">gallery_thumbnail</span>
          <span class="text-label-sm font-label-sm uppercase tracking-wider">Cronología Compartida</span>
        </div>
        <h2 class="font-display text-headline-lg text-on-surface" data-titulo-coleccion></h2>
        <p class="font-body-md text-body-md text-on-surface-variant mt-1" data-subtitulo-coleccion></p>
      </div>

      <!-- Selector de mes -->
      <div class="p-1 rounded-full bg-surface-container-lowest/80 border border-outline-variant/30 flex items-center backdrop-blur-md md:self-auto md:w-auto" id="meses"></div>
    </div>

    <!-- Cabecera de galería (solo móvil) -->
    <div class="flex items-center justify-between mb-space-xs md:hidden">
      <h2 class="text-title-lg font-display text-on-background">Galería de Instantes</h2>
      <span class="text-label-sm font-label-sm text-primary flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
        <span data-conteo-galeria></span>
      </span>
    </div>

    <!-- Rejilla -->
    <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-space-sm md:gap-6" id="galeria"></div>
  </section>

  <!-- Pie / cita de cierre -->
  <div class="my-space-xs md:hidden p-space-sm rounded-xl bg-surface-container-lowest/70 border border-primary/20 backdrop-blur-md flex items-center justify-between enter enter-3">
    <div class="flex items-center gap-space-xs">
      <span class="material-symbols-outlined text-primary text-[20px]">favorite_border</span>
      <div class="flex flex-col">
        <span class="text-label-md font-label-md text-on-background" data-pie-titulo></span>
        <span class="text-label-sm font-label-sm text-on-surface-variant" data-pie-nota></span>
      </div>
    </div>
    <span class="text-label-sm font-label-sm text-tertiary px-2 py-0.5 rounded-full bg-surface-variant border border-outline-variant/20">Siempre</span>
  </div>

  <section class="hidden md:block w-full rounded-2xl bg-gradient-to-r from-surface-container-low/70 via-surface-container/60 to-surface-container-low/70 border border-outline-variant/30 backdrop-blur-xl p-12 text-center relative overflow-hidden enter enter-3">
    <div class="absolute -bottom-16 -left-16 w-56 h-56 bg-primary-container/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -top-16 -right-16 w-56 h-56 bg-secondary/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="relative z-10 max-w-2xl mx-auto">
      <h2 class="font-display text-headline-lg text-on-surface italic mb-4" data-cita></h2>
      <p class="font-body-lg text-body-lg text-on-surface-variant font-light mb-6" data-cita-detalle></p>
      <div class="flex items-center justify-center gap-6 text-label-sm font-label-sm text-on-surface-variant">
        <span class="flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[14px] text-primary">calendar_month</span>
          <span data-cita-inicio></span>
        </span>
        <span class="w-8 h-px bg-outline-variant/40"></span>
        <span class="flex items-center gap-1.5 text-primary">
          <span class="material-symbols-outlined fill-icon text-[14px]">favorite</span>
          <span data-cita-hoy></span>
        </span>
      </div>
    </div>
  </section>
</main>

<!-- Visor a pantalla completa -->
<div id="visor" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-surface-container-lowest/90 backdrop-blur-xl">
  <button type="button" id="cerrar-visor" aria-label="Cerrar"
          class="absolute top-4 right-4 w-10 h-10 rounded-full bg-surface-container/80 border border-outline-variant/30 text-on-surface flex items-center justify-center active:scale-90 transition-transform">
    <span class="material-symbols-outlined">close</span>
  </button>
  <figure class="max-w-lg md:max-w-3xl w-full">
    <div class="rounded-xl overflow-hidden border border-white/10 shadow-[0_25px_60px_-12px_rgba(0,0,0,0.85)] aspect-[4/5] md:aspect-[16/10] bg-surface-container-high" id="visor-marco"></div>
    <figcaption class="mt-3 text-center">
      <p class="text-title-lg md:text-headline-md font-display text-on-surface" id="visor-titulo"></p>
      <p class="text-body-md text-on-surface-variant italic mt-0.5" id="visor-nota"></p>
    </figcaption>
  </figure>
</div>

<script src="js/common.js"></script>
<script>
(function () {
  Cosmic.acceso.exigir();

  const c = COSMIC.recuerdos;
  const $ = (s) => document.querySelector(s);
  const t = Cosmic.tiempo();
  const hito = Cosmic.hito();

  /* ── Textos ── */
  $('[data-etiqueta]').textContent        = Cosmic.etiquetaHito().replace(' Juntos', ' Compartiendo la Eternidad');
  $('[data-etiqueta-amplia]').textContent = hito + ' de Amor';
  $('[data-titulo]').textContent          = c.titulo;
  $('[data-titulo-amplio]').textContent   = c.tituloAmplio;
  $('[data-subtitulo]').textContent       = c.subtitulo;
  $('[data-subtitulo-amplio]').textContent = c.subtituloAmplio;
  $('[data-titulo-coleccion]').textContent = c.tituloColeccion;
  $('[data-subtitulo-coleccion]').textContent = c.subtituloColeccion;
  $('[data-pie-titulo]').textContent = Cosmic.miles(t.diasTotales) + ' Días de Historia';
  $('[data-pie-nota]').textContent   = c.piePagina;
  $('[data-conteo-destacados]').textContent = `Desliza • ${c.destacados.length} recuerdos`;
  $('[data-conteo-galeria]').textContent    = `${c.galeria.length} guardados`;
  $('[data-cita]').textContent         = Cosmic.texto(c.cita.texto);
  $('[data-cita-detalle]').textContent = Cosmic.texto(c.cita.detalle);
  $('[data-cita-inicio]').textContent  = Cosmic.fechaLarga();
  $('[data-cita-hoy]').textContent     = Cosmic.miles(t.diasTotales) + ' días después';

  /* ── Destacados: carrusel móvil ── */
  document.getElementById('destacados-movil').innerHTML = c.destacados.map((r, i) => `
    <article data-abrir="d${i}"
             class="snap-center shrink-0 w-[78vw] max-w-[290px] aspect-[4/5] rounded-xl overflow-hidden relative bg-surface-container-high border border-${r.acento}/20 shadow-[0_12px_28px_-8px_rgba(0,0,0,0.7)] cursor-pointer active:scale-[0.98] transition-transform">
      ${Cosmic.medio(r)}
      <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/30 to-transparent flex flex-col justify-end p-space-md">
        <div class="flex items-center gap-1.5 mb-1">
          <span class="px-2 py-0.5 rounded-full bg-${r.acento}/20 backdrop-blur-md border border-${r.acento}/30 text-${r.acento} text-label-sm font-label-sm">${r.fecha}</span>
          <span class="text-label-sm font-label-sm text-tertiary flex items-center gap-0.5">
            <span class="material-symbols-outlined text-[12px]">${r.iconoDetalle}</span> ${r.detalle}
          </span>
        </div>
        <h3 class="text-title-lg font-display text-on-background">${r.titulo}</h3>
        <p class="text-body-md font-body-md text-on-surface-variant italic mt-0.5 line-clamp-2">${r.frase}</p>
      </div>
      <div class="absolute top-space-xs right-space-xs p-1.5 rounded-full bg-surface-container-lowest/60 backdrop-blur-md ${r.favorito ? 'text-primary' : 'text-secondary'}">
        <span class="material-symbols-outlined text-[16px] ${r.favorito ? 'fill-icon' : ''}">${r.favorito ? 'favorite' : 'favorite_border'}</span>
      </div>
    </article>`).join('');

  /* ── Destacados: protagonista en escritorio ── */
  let actual = 0;
  const total = c.destacados.length;

  function pintarProtagonista() {
    const r = c.destacados[actual];
    const etiquetas = (r.etiquetas || []).map((e) => `
      <span class="inline-flex items-center gap-1.5 text-label-sm font-label-sm text-${e.color} bg-surface-container-high/40 px-2.5 py-1 rounded-full">
        <span class="material-symbols-outlined text-[13px]">${e.icono}</span>${e.texto}
      </span>`).join('');

    document.getElementById('protagonista').innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
        <div class="md:col-span-6 relative group overflow-hidden rounded-xl aspect-[4/3] bg-surface-container-lowest border border-white/10 cursor-pointer" data-abrir="d${actual}">
          ${Cosmic.medio(r, 'w-full h-full object-cover transition-transform duration-700 group-hover:scale-105')}
          <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/90 via-surface-container-lowest/20 to-transparent pointer-events-none"></div>
          <div class="absolute bottom-3 left-3 right-3 flex justify-between items-center text-label-sm font-label-sm text-on-surface pointer-events-none">
            ${r.lugar ? `<span class="flex items-center gap-1 bg-surface-container-lowest/70 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/10">
              <span class="material-symbols-outlined text-[14px] text-tertiary">location_on</span>${r.lugar}</span>` : '<span></span>'}
            <span class="bg-surface-container-lowest/70 backdrop-blur-md px-2 py-1 rounded-full border border-white/10 text-primary">${r.fecha}</span>
          </div>
        </div>

        <div class="md:col-span-6 flex flex-col justify-between h-full space-y-4">
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2.5 py-0.5 rounded-full bg-primary/10 border border-primary/20 text-primary text-label-sm font-label-sm">${r.insignia || 'Recuerdo'}</span>
              <span class="text-on-surface-variant text-label-sm font-label-sm">Recuerdo ${actual + 1} de ${total}</span>
            </div>
            <h3 class="font-display text-headline-lg text-on-surface mb-2">${r.titulo}</h3>
            <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed mb-4 italic">${r.fraseAmplia || r.frase}</p>
            ${etiquetas ? `<div class="flex flex-wrap gap-2 pt-2 border-t border-outline-variant/30">${etiquetas}</div>` : ''}
          </div>


        </div>
      </div>`;

    $('[data-lateral-prev]').textContent = c.destacados[(actual - 1 + total) % total].titulo;
    $('[data-lateral-next]').textContent = c.destacados[(actual + 1) % total].titulo;

    document.getElementById('puntos').innerHTML = c.destacados.map((_, i) => `
      <button type="button" data-punto="${i}" aria-label="Ir al recuerdo ${i + 1}"
              class="${i === actual ? 'w-8 bg-primary' : 'w-2.5 bg-outline-variant hover:bg-primary/50'} h-2 rounded-full transition-all duration-300"></button>`).join('');

    conectar();
  }

  function mover(paso) {
    actual = (actual + paso + total) % total;
    pintarProtagonista();
  }

  /* ── Selector de meses ── */
  const totalMeses = Math.max(1, t.mesesTotales);
  let mesActivo = 0; // 0 = todos

  function pintarMeses() {
    const botones = [{ id: 0, corto: 'Todos', largo: `Todos (${c.galeria.length})` }];
    for (let m = 1; m <= totalMeses; m++) {
      botones.push({ id: m, corto: `Mes ${m}`, largo: m === totalMeses ? `Mes ${m} (Hoy)` : `Mes ${m}` });
    }
    document.getElementById('meses').innerHTML = botones.map((b) => {
      const activo = b.id === mesActivo;
      return `<button type="button" data-mes="${b.id}"
        class="flex-1 md:flex-none whitespace-nowrap px-3 md:px-4 py-1.5 md:py-2 rounded-full text-center text-label-md font-label-md transition-all duration-200
               ${activo ? 'bg-surface-variant md:bg-surface-container-high text-primary font-bold border border-primary/20 shadow-sm'
                        : 'text-on-surface-variant hover:text-primary md:hover:text-on-surface'}">
        <span class="md:hidden">${b.corto}</span><span class="hidden md:inline">${b.largo}</span>
      </button>`;
    }).join('');

    document.querySelectorAll('[data-mes]').forEach((b) =>
      b.addEventListener('click', () => { mesActivo = Number(b.dataset.mes); pintarMeses(); pintarGaleria(); }));
  }

  /* ── Galería ── */
  function pintarGaleria() {
    // Reparte los recuerdos entre los meses disponibles cuando se filtra
    const items = c.galeria
      .map((r, i) => ({ ...r, i, mes: (r.mes || Math.min(totalMeses, Math.floor(i / Math.ceil(c.galeria.length / totalMeses)) + 1)) }))
      .filter((r) => !mesActivo || r.mes === mesActivo);

    // Tarjeta para añadir (solo escritorio)
    const tarjetaAnadir = `
      <div data-anadir class="hidden md:flex group relative rounded-2xl bg-surface-container-low/60 hover:bg-surface-container/70 border-2 border-dashed border-primary/30 hover:border-primary/60 p-8 flex-col justify-between items-center text-center transition-all duration-300 hover:shadow-[0_0_30px_rgba(244,114,182,0.15)] cursor-pointer">
        <div class="w-16 h-16 rounded-full bg-primary/10 border border-primary/30 flex items-center justify-center text-primary group-hover:scale-110 group-hover:bg-primary/20 transition-all duration-300 mb-6">
          <span class="material-symbols-outlined text-[32px]">add_photo_alternate</span>
        </div>
        <div class="space-y-3">
          <h3 class="font-display text-headline-md text-on-surface">Añadir Nuevo Recuerdo</h3>
          <p class="font-body-md text-body-md text-on-surface-variant">Inmortaliza otra fecha especial en nuestra colección de recuerdos compartidos.</p>
        </div>
        <div class="mt-8 w-full">
          <span class="inline-flex items-center justify-center gap-2 w-full py-3 rounded-xl bg-surface-container-high/60 group-hover:bg-primary group-hover:text-surface-container-lowest border border-outline-variant/40 group-hover:border-transparent font-label-md text-label-md text-primary font-medium transition-all duration-300">
            <span class="material-symbols-outlined text-[18px]">cloud_upload</span>
            Subir fotografía
          </span>
        </div>
      </div>`;

    const tarjetas = items.map((r) => `
      <div data-abrir="g${r.i}"
           class="group relative rounded-xl md:rounded-2xl overflow-hidden md:overflow-visible bg-surface-container-low md:bg-surface-container/75 md:backdrop-blur-xl border border-outline-variant/20 md:border-white/10 hover:border-primary/30 md:hover:border-primary/40 md:p-3.5 md:flex md:flex-col transition-all duration-300 md:hover:-translate-y-1.5 md:hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.7),0_0_25px_rgba(192,132,252,0.12)] cursor-pointer active:scale-[0.98]">
        <div class="aspect-square md:aspect-[4/3] w-full relative md:overflow-hidden md:rounded-xl md:mb-4 md:bg-surface-container-lowest">
          ${Cosmic.foto(r.foto, r.titulo, 'w-full h-full object-cover md:transition-transform md:duration-500 md:group-hover:scale-105')}
          <div class="absolute top-2 md:top-3 left-2 md:left-3 px-1.5 md:px-2.5 py-0.5 rounded md:rounded-full bg-surface-container-lowest/80 backdrop-blur-md text-[10px] md:text-label-sm font-label-sm text-secondary border border-outline-variant/20 md:border-white/10">${r.fecha}</div>
          <div class="hidden md:block absolute bottom-3 right-3 px-2 py-0.5 rounded-md bg-surface-container-lowest/80 backdrop-blur-md text-[11px] text-on-surface-variant">Mes ${r.mes}</div>
        </div>
        <div class="p-space-xs md:p-0 md:pb-1 bg-surface-container-lowest/60 md:bg-transparent">
          <p class="font-label-md text-label-md md:text-title-lg md:font-display text-on-background truncate md:whitespace-normal">${r.titulo}</p>
          <p class="font-label-sm text-label-sm md:text-body-md text-on-surface-variant truncate md:whitespace-normal md:mt-1">${r.nota}</p>
        </div>
      </div>`).join('');

    const vacio = !items.length ? `
      <p class="col-span-2 lg:col-span-3 text-center text-on-surface-variant/70 text-body-md py-8 md:py-16">
        No hay recuerdos guardados en este mes todavía.
      </p>` : '';

    document.getElementById('galeria').innerHTML = tarjetaAnadir + vacio + tarjetas;
    conectar();
  }

  /* ── Visor ── */
  const visor = document.getElementById('visor');

  function abrir(clave) {
    const tipo = clave[0];
    const i = Number(clave.slice(1));
    const r = tipo === 'd' ? c.destacados[i] : c.galeria[i];
    document.getElementById('visor-marco').innerHTML = Cosmic.medio(r);
    document.getElementById('visor-titulo').textContent = r.titulo;
    document.getElementById('visor-nota').textContent = r.fraseAmplia || r.frase || r.nota || '';
    visor.classList.replace('hidden', 'flex');
  }
  const cerrar = () => visor.classList.replace('flex', 'hidden');

  /* ── Conexión de eventos (se repite tras cada repintado) ── */
  function conectar() {
    document.querySelectorAll('[data-abrir]').forEach((el) => {
      if (el.dataset.conectado) return;
      el.dataset.conectado = '1';
      el.addEventListener('click', () => abrir(el.dataset.abrir));
    });
    document.querySelectorAll('[data-anadir]').forEach((el) => {
      if (el.dataset.conectado) return;
      el.dataset.conectado = '1';
      el.addEventListener('click', () => alert(
        'Para añadir un recuerdo:\n\n1. Copia la foto en  assets/fotos/\n2. Añade una entrada en  js/config.js  →  recuerdos.galeria'));
    });
    document.querySelectorAll('[data-punto]').forEach((el) =>
      el.addEventListener('click', () => { actual = Number(el.dataset.punto); pintarProtagonista(); }));
  }

  document.querySelectorAll('[data-carrusel]').forEach((b) =>
    b.addEventListener('click', () => mover(Number(b.dataset.carrusel))));

  document.querySelectorAll('[data-ir-galeria]').forEach((b) =>
    b.addEventListener('click', () =>
      document.getElementById('galeria-seccion').scrollIntoView({ behavior: 'smooth' })));

  document.getElementById('cerrar-visor').addEventListener('click', cerrar);
  visor.addEventListener('click', (e) => { if (e.target === visor) cerrar(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowRight' && visor.classList.contains('hidden')) mover(1);
    else if (e.key === 'ArrowLeft'  && visor.classList.contains('hidden')) mover(-1);
  });

  pintarProtagonista();
  pintarMeses();
  pintarGaleria();
})();
</script>
</body>
</html>
